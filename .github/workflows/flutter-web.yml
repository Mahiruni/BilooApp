name: Flutter Web Build
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders without replacing Biloo source
        run: |
          cp lib/main.dart /tmp/biloo_main.dart
          cp pubspec.yaml /tmp/biloo_pubspec.yaml
          flutter create . --platforms=android,web --project-name=biloo --org=com.biloo
          cp /tmp/biloo_main.dart lib/main.dart
          cp /tmp/biloo_pubspec.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: biloo-flutter-web
          path: mobile/build/web
